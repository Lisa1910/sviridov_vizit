<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhiteLisa — Визуализации АР</title>
    <style>
        /* Люксовая бургундская палитра Deep Burgundy, Bordeaux & Silk */
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #230d0c 0%, #110404 100%);
            color: #fcfaf7;
            font-family: 'Times New Roman', Times, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 4vh 2vw;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Текстурный оверлей — эффект дорогой хлопковой бумаги */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            opacity: 0.05;
            pointer-events: none;
            z-index: 9999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://w3.org id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Крупная благородная шапка */
        header {
            text-align: center;
            margin-bottom: 2vh;
            z-index: 10;
        }

        header h1 {
            font-size: clamp(34px, 5.5vw, 62px);
            font-weight: 300;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            margin: 0 0 8px 0;
            color: #fcfaf7;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        header p {
            font-size: clamp(11px, 1.3vw, 15px);
            letter-spacing: 0.15em;
            color: #cc9f93;
            margin: 0;
            text-transform: uppercase;
        }

        /* Стабильный контейнер сцены */
        .scene {
            position: relative;
            width: 85vw;
            max-width: 1100px;
            height: 56.25vw;
            max-height: 618px;
            margin: auto 0;
            touch-action: none;
        }

        .book {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Многослойные слайды со строгой геометрией без скруглений на смартфонах */
        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1e0f0f;
            border-radius: clamp(6px, 1.5vw, 20px);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            opacity: 0;
            transform: translateX(0);
            /* Ультра-стабильный кристально-плавный переход */
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
            will-change: transform, opacity;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }

        /* Точные, не ломающиеся состояния слоев */
        .slide.active {
            opacity: 1;
            z-index: 3;
            transform: translateX(0) scale(1);
        }

        /* Просмотренный лист аккуратно смещается влево */
        .slide.passed {
            opacity: 0;
            transform: translateX(-100%) scale(0.95);
            z-index: 1;
        }

        /* Ожидающий лист затаился в глубине под активным */
        .slide.upcoming {
            opacity: 0;
            transform: translateX(0) scale(0.96);
            z-index: 2;
        }

        /* Направляющая легкая тень, разделяющая листы */
        .slide::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            z-index: 4;
        }
        .slide.upcoming::after {
            opacity: 1; /* Затемняем нижний лист, пока верхний не сдвинут */
        }

        /* Блок управления под изображением */
        .controls-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 3vh;
            z-index: 10;
        }

        .nav-wrapper {
            display: flex;
            align-items: center;
            gap: 45px;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid rgba(252, 250, 247, 0.15);
            color: #fcfaf7;
            width: 65px;
            height: 45px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            border-radius: clamp(3px, 0.6vw, 8px);
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            border-color: #fcfaf7;
            background-color: rgba(252, 250, 247, 0.04);
        }

        .counter {
            font-size: 14px;
            letter-spacing: 0.2em;
            color: #cc9f93;
            text-transform: uppercase;
        }

        /* Безупречная адаптивность под вертикальные смартфоны */
        @media (max-width: 768px) {
            body {
                justify-content: center;
                padding: 3vh 0;
            }

            header {
                margin-bottom: 4vh;
                padding: 0 6vw;
            }

            .scene {
                width: 100vw;
                height: 125vw;
                max-height: 65vh;
            }

            .slide {
                border-radius: 0px;
            }

            .slide img {
                object-fit: cover;
            }

            .nav-wrapper {
                gap: 55px;
            }
            
            .controls-container {
                margin-top: 5vh;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>WhiteLisa</h1>
        <p>Индивидуальный жилой дом — Визуализации АР</p>
    </header>
    <div class="scene" id="scene">
        <div class="book" id="book">
            <div class="slide"><img src="04.webp" alt="04" loading="eager"></div>
            <div class="slide"><img src="05.webp" alt="05" loading="lazy"></div>
            <div class="slide"><img src="06.webp" alt="06" loading="lazy"></div>
            <div class="slide"><img src="07.webp" alt="07" loading="lazy"></div>
            <div class="slide"><img src="08.webp" alt="08" loading="lazy"></div>
            <div class="slide"><img src="09.webp" alt="09" loading="lazy"></div>
            <div class="slide"><img src="10.webp" alt="10" loading="lazy"></div>
            <div class="slide"><img src="11.webp" alt="11" loading="lazy"></div>
            <div class="slide"><img src="12.webp" alt="12" loading="lazy"></div>
            <div class="slide"><img src="13.webp" alt="13" loading="lazy"></div>
            <div class="slide"><img src="14.webp" alt="14" loading="lazy"></div>
        </div>
    </div>

    <div class="controls-container">
        <div class="nav-wrapper">
            <button class="nav-btn" id="prevBtn">←</button>
            <div class="counter" id="counter">Лист: 1 / 11</div>
            <button class="nav-btn" id="nextBtn">→</button>
        </div>
    </div>

    <script>
        const scene = document.getElementById('scene');
        const slides = document.querySelectorAll('.slide');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const counter = document.getElementById('counter');

        let currentIndex = 0;
        const totalSlides = slides.length;
        const imageSources = Array.from(slides).map(slide => slide.querySelector('img').src);

        let isDragging = false;
        let startX = 0;
        let currentX = 0;
        let deltaX = 0;

        function preloadImages(index) {
            const nextIdx = (index + 1) % totalSlides;
            const afterNextIdx = (index + 2) % totalSlides;
            [nextIdx, afterNextIdx].forEach(idx => {
                const img = slides[idx].querySelector('img');
                if (img.getAttribute('loading') === 'lazy') {
                    img.src = imageSources[idx];
                    img.removeAttribute('loading');
                }
            });
        }

        function updateBookState() {
            slides.forEach((slide, idx) => {
                // Возвращаем стабильные transition-стили для безопасной дотяжки
                slide.style.transition = 'transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease';
                
                slide.classList.remove('active', 'passed', 'upcoming');

                if (idx === currentIndex) {
                    slide.classList.add('active');
                    slide.style.transform = 'translateX(0) scale(1)';
                } else if (idx < currentIndex) {
                    slide.classList.add('passed');
                    slide.style.transform = 'translateX(-100%) scale(0.95)';
                } else {
                    slide.classList.add('upcoming');
                    slide.style.transform = 'translateX(0) scale(0.96)';
                }
            });

            counter.innerText = `Лист: ${currentIndex + 1} / ${totalSlides}`;
            preloadImages(currentIndex);
        }

        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex < totalSlides - 1) ? currentIndex + 1 : 0;
            updateBookState();
        });

        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex > 0) ? currentIndex - 1 : totalSlides - 1;
            updateBookState();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space') nextBtn.click();
            if (e.key === 'ArrowLeft') prevBtn.click();
        });

        /* ================= НАДЕЖНЫЙ ДВИЖОК СЕНСОРНОГО СДВИГА СО SNAP-ЭФФЕКТОМ ================= */
        
        function dragStart(x) {
            isDragging = true;
            startX = x;
            deltaX = 0;
            
            const activeSlide = slides[currentIndex];
            if (activeSlide) activeSlide.style.transition = 'none';
        }

        function dragMove(x) {
            if (!isDragging) return;
            currentX = x;
            deltaX = currentX - startX;

            const activeSlide = slides[currentIndex];
            
            // Позволяем сдвигать слайд влево (вперед по проекту)
            if (deltaX < 0 && currentIndex < totalSlides - 1) {
                activeSlide.style.transform = `translateX(${deltaX}px) scale(1)`;
                
                // Элегантное проявление нижнего листа
                const nextSlide = slides[currentIndex + 1];
                if (nextSlide) {
                    const sceneWidth = scene.clientWidth;
                    const ratio = Math.min(Math.abs(deltaX) / sceneWidth, 1);
                    nextSlide.style.opacity = ratio;
                    nextSlide.style.transform = `translateX(0) scale(${0.96 + (ratio * 0.04)})`;
                }
            } 
            // Позволяем сдвигать слайд вправо (назад по проекту)
            else if (deltaX > 0 && currentIndex > 0) {
                const prevSlide = slides[currentIndex - 1];
                if (prevSlide) {
                    prevSlide.style.transition = 'none';
                    prevSlide.style.opacity = 1;
                    prevSlide.style.transform = `translateX(${-scene.clientWidth + deltaX}px) scale(1)`;
                }
            }
        }

        function dragEnd() {
            if (!isDragging) return;
            isDragging = false;
            
            const sceneWidth = scene.clientWidth;
            const threshold = sceneWidth * 0.20; // Порог свайпа — 20% экрана

            // Если жест уверенный — перелистываем, если слабый — snap back (слайд жестко прыгает обратно)
            if (deltaX < -threshold && currentIndex < totalSlides - 1) {
                currentIndex++;
            } else if (deltaX > threshold && currentIndex > 0) {
                currentIndex--;
            }
            
            updateBookState();
        }

        // Привязка событий
        scene.addEventListener('touchstart', e => dragStart(e.touches[0].clientX), { passive: true });
        scene.addEventListener('touchmove', e => dragMove(e.touches[0].clientX), { passive: true });
        scene.addEventListener('touchend', dragEnd);

        scene.addEventListener('mousedown', e => dragStart(e.clientX));
        window.addEventListener('mousemove', e => { if (isDragging) dragMove(e.clientX); });
        window.addEventListener('mouseup', dragEnd);

        window.addEventListener('DOMContentLoaded', () => {
            updateBookState();
        });
    </script>
</body>
</html>
