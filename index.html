<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhiteLisa — Визуализации АР</title>
    <style>
        /* Премиальная бургундская палитра Deep Burgundy & Silk */
        html {
            scroll-behavior: smooth;
        }
        
        body {
            margin: 0;
            padding: 0;
            background: #1a0808; /* Благородный темный бургунди в базе */
            color: #fcfaf7;
            font-family: 'Times New Roman', Times, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Текстура дорогой хлопковой бумаги поверх всей прокрутки */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            opacity: 0.05; pointer-events: none; z-index: 9999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://w3.org id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Крупная величественная шапка в начале страницы */
        header {
            text-align: center;
            padding: 8vh 2vw 4vh 2vw;
            z-index: 10;
            background: linear-gradient(to bottom, #2d1413 0%, #1a0808 100%);
            width: 100%;
            box-sizing: border-box;
        }

        header h1 {
            font-size: clamp(38px, 6vw, 68px);
            font-weight: 300;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            margin: 0 0 12px 0;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        header p {
            font-size: clamp(11px, 1.4vw, 16px);
            letter-spacing: 0.15em;
            color: #cc9f93;
            margin: 0;
            text-transform: uppercase;
        }

        /* Полноэкранный Scroll-контейнер */
        .gallery-container {
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1a0808;
        }

        /* Каждая секция занимает ровно всю ширину экрана и вписана по высоте */
        .project-page {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            background-color: #110404; /* Усиленное глубокое затемнение под кадром */
            border-bottom: 1px solid #2d1413;
        }

        .project-page img {
            width: 100vw;
            height: 100vh;
            object-fit: contain; /* Сохраняет пропорции чертежей 16:9 без искажений */
            display: block;
        }

        /* Фиксированные сбоку современные затухающие точки */
        .dots-nav {
            position: fixed;
            right: 3vw;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
            mix-blend-mode: difference; /* Точки автоматически видны на любом фоне */
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: #fcfaf7;
            border-radius: 50%;
            opacity: 0.15;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Современный эффект затухания точек при скролле */
        .dot.active {
            opacity: 0.9;
            height: 20px;
            border-radius: 4px;
        }
        .dot:hover {
            opacity: 0.6;
        }

        /* Футер с премиальной кнопкой скачивания PDF */
        footer {
            width: 100%;
            padding: 10vh 2vw;
            background: linear-gradient(to top, #2d1413 0%, #1a0808 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            z-index: 10;
        }

        /* Трендовая прозрачная кнопка с 1px рамкой и свечением */
        .download-btn {
            background: transparent;
            border: 1px solid rgba(252, 250, 247, 0.2);
            color: #fcfaf7;
            padding: 18px 36px;
            font-size: 14px;
            font-family: 'Times New Roman', Times, serif;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 2px;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .download-btn:hover {
            border-color: #fcfaf7;
            background-color: rgba(252, 250, 247, 0.05);
            box-shadow: 0 0 25px rgba(252, 250, 247, 0.25);
            transform: translateY(-2px);
        }

        .download-btn:active {
            transform: translateY(1px);
            background-color: rgba(252, 250, 247, 0.15);
        }

        /* Идеальная адаптивность под мобильные телефоны */
        @media (max-width: 768px) {
            header { padding: 6vh 4vw 3vh 4vw; }
            .project-page { height: calc(100vh - 60px); }
            .project-page img { object-fit: cover; } /* На смартфонах разворачиваем во всю ширину без полей */
            .dots-nav { right: 4vw; }
            .download-btn { width: 85%; text-align: center; padding: 16px 20px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>WhiteLisa</h1>
        <p>Индивидуальный жилой дом — Визуализации АР</p>
    </header>

    <!-- Боковая пагинация точками (генерируется скриптом) -->
    <div class="dots-nav" id="dotsNav"></div>
    <div class="gallery-container">
        <!-- Каждое изображение выведено отдельной полноэкранной секцией -->
        <section class="project-page" id="page-0"><img src="04.webp" alt="Визуализация 04"></section>
        <section class="project-page" id="page-1"><img src="05.webp" alt="Визуализация 05" loading="lazy"></section>
        <section class="project-page" id="page-2"><img src="06.webp" alt="Визуализация 06" loading="lazy"></section>
        <section class="project-page" id="page-3"><img src="07.webp" alt="Визуализация 07" loading="lazy"></section>
        <section class="project-page" id="page-4"><img src="08.webp" alt="Визуализация 08" loading="lazy"></section>
        <section class="project-page" id="page-5"><img src="09.webp" alt="Визуализация 09" loading="lazy"></section>
        <section class="project-page" id="page-6"><img src="10.webp" alt="Визуализация 10" loading="lazy"></section>
        <section class="project-page" id="page-7"><img src="11.webp" alt="Визуализация 11" loading="lazy"></section>
        <section class="project-page" id="page-8"><img src="12.webp" alt="Визуализация 12" loading="lazy"></section>
        <section class="project-page" id="page-9"><img src="13.webp" alt="Визуализация 13" loading="lazy"></section>
        <section class="project-page" id="page-10"><img src="14.webp" alt="Визуализация 14" loading="lazy"></section>
    </div>

    <footer>
        <!-- Кнопка скачивания. Файл project.pdf должен лежать в корневом каталоге репозитория -->
        <a href="project.pdf" download="WhiteLisa_Project_AR.pdf" class="download-btn">
            Скачать документацию проекта (PDF)
        </a>
    </footer>

    <script>
        const pages = document.querySelectorAll('.project-page');
        const dotsNav = document.getElementById('dotsNav');
        
        // Автоматически строим точки по числу секций
        pages.forEach((page, idx) => {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (idx === 0) dot.classList.add('active');
            
            // Клик по точке плавно перемещает к нужному листу
            dot.addEventListener('click', () => {
                page.scrollIntoView({ behavior: 'smooth' });
            });
            
            dotsNav.appendChild(dot);
        });
        
        const dots = document.querySelectorAll('.dot');

        /* Умное отслеживание скролла (Intersection Observer) */
        const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: 0.5 // Точка активируется, когда лист виден более чем наполовину
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const targetId = entry.target.id;
                    const index = parseInt(targetId.split('-')[1]);
                    
                    // Обновляем активную точку
                    dots.forEach((dot, idx) => {
                        if (idx === index) {
                            dot.classList.add('active');
                        } else {
                            dot.classList.remove('active');
                        }
                    });

                    // Ленивая подгрузка соседних изображений при приближении скролла
                    preloadAdjacentImages(index);
                }
            });
        }, observerOptions);

        pages.forEach(page => observer.observe(page));

        // Алгоритм фонового кэширования
        function preloadAdjacentImages(currentIndex) {
            const total = pages.length;
            const nextIdx = (currentIndex + 1) % total;
            const afterNextIdx = (currentIndex + 2) % total;
            
            [nextIdx, afterNextIdx].forEach(idx => {
                const img = pages[idx].querySelector('img');
                if (img && img.getAttribute('loading') === 'lazy') {
                    img.removeAttribute('loading');
                }
            });
        }
    </script>
</body>
</html>
