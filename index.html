<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhiteLisa — Визуализации АР</title>
    <style>
        /* Интерьерная благородная палитра (Dark Espresso, Chocolate & Burgundy) */
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1110; /* Эстетичный кофейно-шоколадный фон */
            color: #f4efe9; /* Текст молочно-белого оттенка */
            font-family: 'Times New Roman', Times, serif; /* Тонкая классическая гарнитура */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Текстурный оверлей — деликатный эффект матового холста или бумаги */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            opacity: 0.04;
            pointer-events: none;
            z-index: 9999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://w3.org id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Шапка проекта */
        header {
            text-align: center;
            margin-bottom: 20px;
            z-index: 10;
        }

        header h1 {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin: 0 0 5px 0;
        }

        header p {
            font-size: 14px;
            letter-spacing: 0.05em;
            color: #bfa89e; /* Приглушенный карамельный тон */
            margin: 0;
        }

        /* Рамка чертежа/галереи */
        .slider-container {
            position: relative;
            width: 80vw;
            max-width: 1000px;
            height: 56.25vw; /* Пропорция 16:9 */
            max-height: 562px;
            background-color: #261c1b;
            border: 1px solid #3d2d2b;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .slider-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
            will-change: transform; /* Аппаратное ускорение на видеокарте */
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1); /* Плавный переход */
        }

        .slide {
            min-width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #261c1b;
        }

        /* Оптимальный рендеринг картинок */
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Тонкие стильные кнопки навигации */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: 1px solid rgba(244, 239, 233, 0.2);
            color: #f4efe9;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            z-index: 20;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            border-color: #f4efe9;
            background-color: rgba(244, 239, 233, 0.05);
        }

        .prev-btn { left: -70px; }
        .next-btn { right: -70px; }

        /* Оформление счетчика как в штампе АР */
        .counter {
            margin-top: 20px;
            font-size: 16px;
            letter-spacing: 0.1em;
            color: #bfa89e;
        }

        /* Адаптив для смартфонов и планшетов */
        @media (max-width: 1200px) {
            .prev-btn { left: 10px; }
            .next-btn { right: 10px; }
            .slider-container { width: 95vw; height: 66.8vw; }
        }
    </style>
</head>
<body>

    <header>
        <h1>WhiteLisa</h1>
        <p>Индивидуальный жилой дом — Визуализации АР</p>
    </header>

    <div style="position: relative;">
        <button class="nav-btn prev-btn" id="prevBtn">←</button>
        
        <div class="slider-container">
            <div class="slider-wrapper" id="sliderWrapper">
                <!-- Все слайды переведены на WebP. Первый загружается сразу, остальные — лениво -->
                <div class="slide"><img src="04.webp" alt="Визуализация 04" loading="eager"></div>
                <div class="slide"><img src="05.webp" alt="Визуализация 05" loading="lazy"></div>
                <div class="slide"><img src="06.webp" alt="Визуализация 06" loading="lazy"></div>
                <div class="slide"><img src="07.webp" alt="Визуализация 07" loading="lazy"></div>
                <div class="slide"><img src="08.webp" alt="Визуализация 08" loading="lazy"></div>
                <div class="slide"><img src="09.webp" alt="Визуализация 09" loading="lazy"></div>
                <div class="slide"><img src="10.webp" alt="Визуализация 10" loading="lazy"></div>
                <div class="slide"><img src="11.webp" alt="Визуализация 11" loading="lazy"></div>
                <div class="slide"><img src="12.webp" alt="Визуализация 12" loading="lazy"></div>
                <div class="slide"><img src="13.webp" alt="Визуализация 13" loading="lazy"></div>
                <div class="slide"><img src="14.webp" alt="Визуализация 14" loading="lazy"></div>
            </div>
        </div>

        <button class="nav-btn next-btn" id="nextBtn">→</button>
    </div>

    <div class="counter" id="counter">Лист: 1 / 11</div>

    <script>
        const wrapper = document.getElementById('sliderWrapper');
        const images = wrapper.querySelectorAll('img');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const counter = document.getElementById('counter');

        let currentIndex = 0;
        const totalSlides = images.length;

        // Сохраняем оригинальные пути к WebP файлам для кэширования
        const imageSources = Array.from(images).map(img => img.src);

        function preloadNextImages(index) {
            // Незаметно подгружаем в кэш браузера следующий и последующий слайды
            const nextIdx = (index + 1) % totalSlides;
            const afterNextIdx = (index + 2) % totalSlides;
            
            [nextIdx, afterNextIdx].forEach(idx => {
                if (images[idx].getAttribute('loading') === 'lazy') {
                    images[idx].src = imageSources[idx];
                    images[idx].removeAttribute('loading'); // Убираем ленивый атрибут, так как файл уже качается
                }
            });
        }

        function updateSlider() {
            wrapper.style.transform = `translateX(-${currentIndex * 100}%)`;
            counter.innerText = `Лист: ${currentIndex + 1} / ${totalSlides}`;
            preloadNextImages(currentIndex);
        }

        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex < totalSlides - 1) ? currentIndex + 1 : 0;
            updateSlider();
        });

        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex > 0) ? currentIndex - 1 : totalSlides - 1;
            updateSlider();
        });

        // Навигация с клавиатуры стрелками «Влево / Вправо»
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextBtn.click();
            if (e.key === 'ArrowLeft') prevBtn.click();
        });

        // Как только документ готов, сразу кэшируем первые скрытые слайды
        window.addEventListener('DOMContentLoaded', () => {
            preloadNextImages(0);
        });
    </script>
</body>
</html>
