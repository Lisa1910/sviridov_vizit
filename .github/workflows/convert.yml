name: Auto Convert PNG to WebP

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Позволяет запустить конвертацию вручную кнопкой

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install WebP tools
        run: sudo apt-get install -y webp

      - name: Convert all PNGs to WebP
        run: |
          for f in *.png; do
            if [ -f "$f" ]; then
              cwebp -q 80 "$f" -o "${f%.png}.webp"
              rm "$f" # Удаляем старый тяжелый PNG, чтобы он не занимал место
            fi
          done

      - name: Commit and Push optimized WebP images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Optimize: convert PNG images to lightweight WebP"
          git push
